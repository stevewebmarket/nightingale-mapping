name: NMB3 Block 001

on:
  workflow_dispatch:
  push:
    paths:
      - 'nmb3/nmb3_blocks/block_004_plan.md'

permissions:
  contents: write

jobs:
  block-001:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Show active block plan
        run: |
          echo "Showing active block plan:"
          cat nmb3/nmb3_blocks/block_004_plan.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy librosa soundfile

      - name: Fetch samples
        run: |
          python scripts/fetch_samples.py

      - name: Run current block
        run: |
          mkdir -p nmb3/nmb3_logs nmb3/nmb3_reports
          echo "Reading block plan:"
          cat nmb3/nmb3_blocks/block_004_plan.md
          python run_nmb3_block_004.py 2>&1 | tee nmb3/nmb3_logs/current_block_output.txt
          echo "--- file size ---"
          wc -c nmb3/nmb3_logs/current_block_output.txt
          test -s nmb3/nmb3_logs/current_block_output.txt

      - name: Create current block report
        run: |
          cat > nmb3/nmb3_reports/current_block_report.md <<'EOF'
          # NMB3 Current Block Report

          Active Plan:
          nmb3/nmb3_blocks/block_004_plan.md

          Block Question:
          Does the M3.1 invariance score continue to track onset_delta in the unmeasured boundary regions {0.01, 0.03, 0.25}, and is the resulting combined sweep consistent with Block 002 and Block 003?

          Commands Run:
          - python scripts/fetch_samples.py
          - python run_nmb3_block_004.py

          Raw Results:
          See nmb3/nmb3_logs/current_block_output.txt

          Conclusion:
          Pending interpreter review.
          EOF

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmb3-current-block-report
          path: |
            nmb3/nmb3_logs/current_block_output.txt
            nmb3/nmb3_reports/current_block_report.md

      - name: Commit results back to repo
        run: |
          git config user.name "nmb3-bot"
          git config user.email "nmb3@bot.com"
          git add nmb3/nmb3_logs/current_block_output.txt
          git add nmb3/nmb3_reports/current_block_report.md
          git commit -m "Add current block results" || echo "No changes to commit"
          git push
